name: CI - Test & Build

# Trigger
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Jobs
jobs:
  # Job 1: Test backend
  test-backend:
    name: Run backend tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repo onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.11'
          # Cache pip downloads so subsequest runs are faster
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      # Step 3: Install dependencies
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      # Step 4: Run tests
      - name: Run pytest
        working-directory: backend
        env: 
          GOOGLE_API-KEY: "dummy-key-for-testing"
          JWT_SECRET: "test-secret-key-for-ci"
          JWT_ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
        run: pytest test_main.py -v

  # Job 2: Build frontend in parallel with test-backend
  build-frontend: 
    name: Build React frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci
        
      - name: Build production bundle
        working-directory: frontend
        env:
          VITE_API_URL: "https://placeholder.railway.app"
        run: npm run build

      # If build produces files, CI passes. This catches
      # TypeErrors, missing imports, broken JSX, etc.
      - name: Verify build output exists
        run: test -d frontend/dist

  # Job 3: Build Docker images
  # Only runs AFTER both test-backend and build-frontend pass
  build-docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Docker Buildx — enables advanced build features
      # like multi-platform builds and better caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build backend image (dont push yet, it will be done in CD)
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: interview-backend:ci-test
          cache-from: type=gha
          cache-to: type=gha, mode=max

      # Build frontend image (dont push yet, it will be done in CD)
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: interview-frontend:ci-test
          cache-from: type=gha
          cache-to: type=gha, mode=max