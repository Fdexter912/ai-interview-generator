server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression — reduces response sizes by ~70%
    gzip on;
    gzip types text/plain text/css application/json
               application/javascript text/xml
               application/xml image/svg+sml

    # Cache static assets aggressively — browsers won't
    # re-download JS/CSS files for 1 year. Vite adds
    # content hashes to filenames so cache-busting is
    # automatic when files change.
    location ~* \.(js|css|png|jpg|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router support — any unknown path serves
    # index.html and React handles routing client-side
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}